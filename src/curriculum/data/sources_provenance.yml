# Machine-readable provenance manifest for §6.1 sources of record.
#
# Separates CONTENT verification (is the data correct?) from FILE-LEVEL
# provenance (do we have the official PDF's hash + page numbers?). See SOURCES.md
# for the human-readable version.
#
# RULES (do not violate):
#   - Never write a guessed/placeholder value into `sha256` or `source_page`.
#     Use PENDING / BLOCKED status markers until real values exist.
#   - `official_url` is left blank until a maintainer confirms the exact official
#     URL; it is supplied to the fetch workflow at dispatch time. Do not guess it.
#   - Page numbers are the document's printed footer page numbers, obtained from
#     the fetch workflow's page_map.json — NOT PDF array indices.
#
# Remediation workflow: .github/workflows/fetch-mext-source-and-hash.yml
# (workflow_dispatch; runs on GitHub's hosted runner, which has network egress).

version: 1

sources:
  - id: kanji_teach_grade
    official_document: 学年別漢字配当表 （平成29年3月告示、令和2年度改定）
    official_url: ""            # confirmed MEXT URL — supply at workflow dispatch
    content_verification:
      method: cross_check_against_kankentest_2020_degree_list_and_two_independent_kanjidic_sources
      status: content_confirmed_matching_internal_dataset   # done in issue #1
      verified_at: "2026-08-15"
    file_hash:
      sha256: PENDING
      status: BLOCKED_sandbox_no_network_egress
      remediation: .github/workflows/fetch-mext-source-and-hash.yml
    page_reference:
      status: PENDING_pdf_page_mapping
      note: >-
        Use printed footer page numbers (observed range ~1-51; 附表1/附表2
        appendices ~pages 50-51). Text-extraction-order guesses disallowed.

  # §19.2 — empty scaffolds today; template for when the source data lands.
  - id: kanji_reading_stage
    official_document: 音訓の小・中・高等学校段階別割り振り表 （平成29年3月）
    official_url: ""
    content_verification:
      status: PENDING_founder_source_extraction   # §19.2
    file_hash:
      sha256: PENDING
      status: BLOCKED_awaiting_source
    page_reference:
      status: PENDING_pdf_page_mapping

  - id: lexical_reading_rule
